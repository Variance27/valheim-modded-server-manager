<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Valheim Server Console</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#272c36; --text:#e8eaf0; --muted:#8b93a5; --accent:#6aa3ff; --bad:#ff6b6b; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f5f8; --card:#ffffff; --line:#d9dce4; --text:#1b1e26; --muted:#5d6577; --accent:#2f6fe0; --bad:#c62828; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  main { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  h1 { margin:0 0 4px; font-size:20px; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:13.5px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--text); font:inherit; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { margin-top:20px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { min-height:20px; margin-top:12px; color:var(--bad); font-size:13.5px; }
</style>
</head>
<body>
<main>
  <h1>Valheim Server Console</h1>
  <p class="sub">Sign in to the server dashboard.</p>
  <form id="f" autocomplete="on">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required value="admin">
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="b" type="submit">Sign in</button>
    <div class="err" id="e" role="alert"></div>
  </form>
</main>
<script>
(function () {
  var form = document.getElementById('f'), err = document.getElementById('e'), btn = document.getElementById('b');
  fetch('/api/auth/status').then(function (r) { return r.json(); }).then(function (s) {
    if (s && s.authenticated) location.replace('/');
  }).catch(function () {});
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-VGUI': '1' },
      body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (res) {
      if (res.ok) { location.replace('/'); return; }
      err.textContent = (res.d && res.d.error) || 'Sign-in failed.';
      btn.disabled = false;
      document.getElementById('p').select();
    }).catch(function () {
      err.textContent = 'Could not reach the server.';
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
